name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  user-path:
    name: user-path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    - name: verify:user-path (CLI help; never production)
      run: |
        echo "CI green on this job is necessary and is not an independent pstack verdict."
        ./scripts/verify-user-path

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    # Empty scaffolding for optional relative reads only. Tests never write here:
    # tests/conftest.py forces a per-test temp data_dir and blocks prod writes.
    - name: Create data directories
      run: |
        mkdir -p data/data-3rd-party
        mkdir -p data/forecast

    - name: Run tests
      run: |
        python -m pytest tests/canswim/ -v
